[tool.poetry]
name = "ultimate-swing-trader"
version = "1.0.0"
description = "A conservative adaptive long-only swing-trading research and paper-execution system"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "src", from = "." }
]

[tool.poetry.dependencies]
python = "^3.11"
langchain-anthropic = "0.3.5"  # src/swing/llm_backend.py's Claude backend
pandas = "^2.1.0"
numpy = "^1.24.0"
pydantic = "^2.4.2"
httpx = "^0.27.0"  # also used by src/swing/notification_channels.py (Telegram)
yfinance = "^1.2.0"
lxml = "^5.3.0"  # required by yfinance's Ticker.get_earnings_dates() HTML parsing (src/swing/data_feed.py)
turso-serverless = "^0.1.0"  # hosted DB backend for src/swing/database.py (see docs/CRON_AGENTS.md)

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[tool.poetry.scripts]
swing-trader = "src.swing.cli:main"
